name: Build Universal Dragon Systems APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK cmdline-tools & components (manual)
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT}"
          echo "Using ANDROID_SDK_ROOT=$SDK_ROOT"

          # Ensure SDK root exists and is writable
          sudo mkdir -p "$SDK_ROOT"
          sudo chown -R $USER:$USER "$SDK_ROOT"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          # Download Google commandline tools (adjust filename if Google updates it)
          cd /tmp
          CMDLINE_Z=commandlinetools-linux-9477386_latest.zip
          if [ ! -f "$CMDLINE_Z" ]; then
            curl -fsSL -o "$CMDLINE_Z" "https://dl.google.com/android/repository/$CMDLINE_Z"
          fi
          unzip -o "$CMDLINE_Z" -d cmdline-temp

          # Remove any previous 'latest' directory to avoid mv overwrite errors
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv cmdline-temp/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/" || true

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER" >&2
            ls -la "$SDK_ROOT/cmdline-tools" || true
            exit 1
          fi
          echo "Found sdkmanager: $SDKMANAGER"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          # Temporarily disable pipefail around yes|sdkmanager to avoid SIGPIPE causing the whole script to fail
          set +o pipefail

          # Install required components (change api/build-tools to match your project if needed)
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "cmdline-tools;latest"

          # Accept licenses non-interactively
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          # Re-enable pipefail and restore safe exit behavior
          set -o pipefail

          # Debug info
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version || true
          ls -la "$SDK_ROOT" || true

      - name: Install Dependencies
        run: npm install

      - name: Add Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Configure Universal Compatibility (Android 5.0+ & All Phones)
        run: |
          # Force minSdkVersion to 21 (Android 5.0 Lollipop and above) for maximum device compatibility
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 21/g' android/variables.gradle || true
          # Enable clearTextTraffic and hardwareAcceleration in AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/g' android/app/src/main/AndroidManifest.xml || true

      - name: Generate Launcher Icons & Splash Screen from Logo
        run: npx capacitor-assets generate --android --iconBackgroundColor '#080c16' --splashBackgroundColor '#080c16'

      - name: Sync Web Content
        run: npx cap sync android

      - name: Build Universal APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK to Dragon-Systems.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Dragon-Systems-Universal.apk

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dragon-Systems-APK
          path: ./Dragon-Systems-Universal.apk
